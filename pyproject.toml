[project]
name = "mcp-audit"
dynamic = ["version"]
description = "Static security analysis for Model Context Protocol servers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
mcp-audit = "mcp_audit.cli:main"

[tool.hatch.version]
path = "src/mcp_audit/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_audit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# extend-exclude, not exclude: `exclude` replaces ruff's defaults, which
# would send it walking into .venv and site-packages.
#
# Fixtures are intentionally-vulnerable sample servers -- input data for the
# tests, not code this project ships. Linting them would mean rewriting the
# very patterns they exist to demonstrate.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Pinned rather than left to the default so a ruff upgrade cannot turn a
# green CI run red on style alone.
select = ["E", "F", "W", "I", "UP", "B"]
