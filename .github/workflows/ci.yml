name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .

  self-scan:
    # The console script is the part unit tests cannot reach: an entry point
    # that does not resolve still passes every test in the suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Scan the vulnerable fixtures
        run: mcp-audit tests/fixtures
      - name: SARIF output is valid JSON
        run: mcp-audit tests/fixtures --format sarif | python -m json.tool > /dev/null
      - name: Fixtures trip the failure gate
        run: |
          if mcp-audit tests/fixtures --fail-on critical > /dev/null; then
            echo "expected a non-zero exit from the intentionally vulnerable fixtures"
            exit 1
          fi
